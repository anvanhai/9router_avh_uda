<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9Router AI Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .chat-container { height: 85vh; display: flex; flex-direction: column; }
        .chat-box { flex: 1; overflow-y: auto; background: #fff; padding: 20px; border: 1px solid #dee2e6; border-radius: 0.375rem; }
        .msg { max-width: 80%; margin-bottom: 15px; padding: 12px 18px; border-radius: 20px; line-height: 1.5; }
        .msg-user { background: #0d6efd; color: white; margin-left: auto; border-bottom-right-radius: 0; }
        .msg-bot { background: #f1f3f5; color: black; margin-right: auto; border-bottom-left-radius: 0; }
        #loading { display: none; font-style: italic; color: #6c757d; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card chat-container shadow">
                <div class="card-header bg-primary text-white text-center fw-bold fs-5 py-3">
                    Hệ thống Chat - AI 9Router
                </div>
                
                <div class="card-body chat-box d-flex flex-column" id="chatBox">
                    <div class="msg msg-bot shadow-sm">Xin chào! Tôi là trợ lý AI. Tôi có thể giúp gì cho bạn hôm nay?</div>
                </div>
                
                <div class="card-footer bg-white border-top-0 pb-3 pt-2">
                    <div id="loading" class="mb-2 ms-2">Trợ lý AI đang phản hồi...</div>
                    <div class="input-group input-group-lg">
                        <input type="text" id="userInput" class="form-control rounded-pill border-secondary me-2 fs-6" placeholder="Nhập câu hỏi của bạn tại đây..." onkeypress="handleKeyPress(event)">
                        <button class="btn btn-primary rounded-pill px-4 fw-bold fs-6" onclick="sendMessage()">Gửi</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // NẾU CHẠY 9ROUTER TRÊN MÁY TÍNH (Cách 1 ở tin nhắn trước), BẠN DÙNG LINK DƯỚI ĐÂY:
    const API_URL = "http://localhost:20127/v1/chat/completions"; 
    
    // Nhập API Key của 9Router
    const API_KEY = "sk-1c02797ad20d7518-5y0xil-12c7370b"; 
    
    // Đặt tên Model (hoặc tên Combo bạn cấu hình trong 9Router)
    const MODEL = "openai-gpt-4o"; 

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const loading = document.getElementById("loading");

    let messages = [{ role: "system", content: "Bạn là một trợ lý AI thông minh, thân thiện." }];

    function appendMessage(text, isUser) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg shadow-sm " + (isUser ? "msg-user" : "msg-bot");
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, true);
        messages.push({ role: "user", content: text });
        userInput.value = "";
        loading.style.display = "block";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: messages,
                    stream: false 
                })
            });

            const data = await response.json();
            loading.style.display = "none";

            if (data.choices && data.choices.length > 0) {
                const botReply = data.choices[0].message.content;
                appendMessage(botReply, false);
                messages.push({ role: "assistant", content: botReply });
            } else {
                appendMessage("Lỗi: Không nhận được phản hồi hợp lệ.", false);
            }
        } catch (error) {
            loading.style.display = "none";
            appendMessage("Lỗi kết nối tới 9Router: " + error.message, false);
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>
</body>
</html>
